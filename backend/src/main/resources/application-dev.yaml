quarkus:
  application:
    name: ae-organiza-lar
    version: 1.0.0

  # Database Configuration (Development)
  datasource:
    db-kind: postgresql
    username: aelares_user
    password: aelares_password
    jdbc:
      url: jdbc:postgresql://localhost:5432/aelares_db

  # ORM/Hibernate Configuration
  hibernate-orm:
    database:
      generation: validate
    sql-load-script: no-file

  # Flyway Migrations
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration

  # Email Configuration (MailHog for development)
  mailer:
    host: localhost
    port: 1025
    ssl: false
    trust-all: true

  # CORS Configuration
  http:
    cors:
      origins: http://localhost:4200,http://localhost:8080,http://localhost:3000,http://127.0.0.1:4200
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
      headers: "Content-Type,Authorization,Accept"
      credentials: true
      access-control-max-age: 24H

  # Logging
  log:
    level: INFO
    category:
      "com.aelares": DEBUG
      "io.quarkus": INFO

  # Development Services
  devservices:
    enabled: false

# App-specific configuration
app:
  auth:
    token-expiration-minutes: 10080  # 7 days
    otp-expiration-minutes: 15
    jwt-secret: dev-secret-key-change-in-production

  email:
    enable-async: true

  cors:
    allowed-origins: http://localhost:4200,http://localhost:8080,http://localhost:3000,http://127.0.0.1:4200

  reminder:
    scheduler-interval: 1m

