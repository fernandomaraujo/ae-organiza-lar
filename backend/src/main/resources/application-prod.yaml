quarkus:
  application:
    name: ae-organiza-lar
    version: 1.0.0

  # OpenAPI / Swagger UI — desabilitado em produção
  swagger-ui:
    always-include: false

  # Database Configuration (Railway PostgreSQL)
  datasource:
    db-kind: postgresql
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    jdbc:
      url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}

  # ORM/Hibernate Configuration
  hibernate-orm:
    database:
      generation: validate
    sql-load-script: no-file

  # Flyway Migrations
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Email Configuration (SendGrid)
  mailer:
    host: smtp.sendgrid.net
    port: 587
    ssl: false
    username: apikey
    password: ${SENDGRID_API_KEY}
    from: ${SENDGRID_FROM_EMAIL:noreply@aelares.com}
    trust-all: false

  # CORS Configuration (Railway frontend domain)
  http:
    auth:
      proactive: false
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:https://aelares.railway.app}
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      headers: Content-Type,Authorization

  # Logging
  log:
    level: INFO
    category:
      "com.aelares": INFO
    console:
      json: true

  # Production services disabled
  devservices:
    enabled: false

# App-specific configuration
app:
  auth:
    token-expiration-minutes: 10080  # 7 days
    otp-expiration-minutes: 15
    otp-request-window-minutes: 10
    otp-request-max-attempts: 5
    otp-request-max-attempts-per-ip: 20
    jwt-secret: ${JWT_SECRET}

  email:
    enable-async: true

  cors:
    allowed-origins: ${CORS_ORIGINS:https://aelares.railway.app}

  reminder:
    scheduler-interval: 1m
