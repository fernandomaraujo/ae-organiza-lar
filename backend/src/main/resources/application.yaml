quarkus:
  application:
    name: ae-organiza-lar
    version: 1.0.0

  # Database Configuration
  datasource:
    db-kind: postgresql
    username: aelares_user
    password: aelares_password
    jdbc:
      url: jdbc:postgresql://localhost:5432/aelares_db

  # ORM/Hibernate Configuration
  hibernate-orm:
    database:
      generation: validate
    sql-load-script: no-file

  # Flyway Migrations
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration

  # JWT Configuration
  smallrye-jwt:
    sign:
      key-location: file:${user.home}/.ae-organiza-lar/jwt-key.pem
    verify:
      key-location: file:${user.home}/.ae-organiza-lar/jwt-key.pub.pem
    algorithm: RS256
    issuer: https://aelares.com
    audience: aelares-api

  # Email Configuration (SendGrid)
  mailer:
    host: smtp.sendgrid.net
    port: 587
    ssl: false
    username: apikey
    password: ${SENDGRID_API_KEY:SG.test-key}
    from: noreply@aelares.com
    trust-all: false

  # CORS Configuration
  http:
    cors:
      origins: http://localhost:4200,http://localhost:8080
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH
      headers: Content-Type,Authorization
      credentials: true

  # Logging
  log:
    level: INFO
    category:
      "com.aelares": DEBUG

  # Dev Configuration
  devservices:
    enabled: true
    postgresql:
      image-name: postgres:15-alpine
      db-name: aelares_db
      username: aelares_user
      password: aelares_password

# App-specific configuration
app:
  auth:
    token-expiration-minutes: 10080  # 7 days
    otp-expiration-minutes: 15
    jwt-secret: ${JWT_SECRET:your-secret-key-change-in-production}

  email:
    enable-async: true

  cors:
    allowed-origins: http://localhost:4200,http://localhost:8080

  reminder:
    scheduler-interval: 1m

# Logging in JSON format
"%prod":
  quarkus:
    log:
      console:
        json: true

