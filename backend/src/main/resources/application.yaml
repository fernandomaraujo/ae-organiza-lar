quarkus:
  application:
    name: ae-organiza-lar
    version: 1.0.0

  # OpenAPI / Swagger UI
  smallrye-openapi:
    info-title: "AE Organiza Lar API"
    info-version: "1.0.0"
    info-description: "API para gerenciamento de afazeres domésticos por lar. Login por código enviado ao e-mail — sem senhas armazenadas."
    info-contact-name: "AE Lares"
    info-contact-email: "contato@aelares.com"
  swagger-ui:
    always-include: true
    path: /swagger-ui
    title: "AE Organiza Lar — Swagger UI"

  # Database Configuration (defaults para dev, sobrescrito em prod)
  datasource:
    db-kind: postgresql
    username: ${DB_USER:aelares_user}
    password: ${DB_PASSWORD:aelares_password}
    jdbc:
      url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aelares_db}

  # ORM/Hibernate Configuration
  hibernate-orm:
    database:
      generation: validate
    sql-load-script: no-file

  # Flyway Migrations
  flyway:
    migrate-at-start: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Email Configuration (SendGrid)
  mailer:
    host: ${SMTP_HOST:smtp.sendgrid.net}
    port: ${SMTP_PORT:587}
    ssl: false
    username: ${SMTP_USERNAME:apikey}
    password: ${SENDGRID_API_KEY:SG.test-key}
    from: ${SENDGRID_FROM_EMAIL:noreply@aelares.com}
    trust-all: false

  # CORS Configuration
  http:
    auth:
      proactive: false
    cors:
      enabled: true
      origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}
      methods: GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
      headers: Content-Type,Authorization,Accept
      access-control-max-age: 24H

  # Logging
  log:
    level: INFO
    category:
      "com.aelares": DEBUG

  # Dev Configuration
  devservices:
    enabled: true
    postgresql:
      image-name: postgres:15-alpine
      db-name: aelares_db
      username: aelares_user
      password: aelares_password

# App-specific configuration
app:
  auth:
    token-expiration-minutes: 10080  # 7 days
    otp-expiration-minutes: 15
    otp-request-window-minutes: 10
    otp-request-max-attempts: 5
    otp-request-max-attempts-per-ip: 20
    jwt-secret: ${JWT_SECRET:dev-secret-key-change-in-production}

  email:
    enable-async: true

  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:8080}

  reminder:
    scheduler-interval: 1m

# Logging in JSON format
"%prod":
  quarkus:
    log:
      console:
        json: true
