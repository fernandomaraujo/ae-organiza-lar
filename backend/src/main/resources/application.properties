# CORS fallback in .properties to guarantee preflight support even if YAML mapping differs.
quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
quarkus.http.cors.headers=Content-Type,Authorization,Accept
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.access-control-max-age=24H

%dev.quarkus.http.cors.origins=http://localhost:4200,http://localhost:8080,http://localhost:3000,http://127.0.0.1:4200
%dev.quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD

